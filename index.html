<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown 🎉</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background: #0f172a;
      color: #e5e7eb;
      transition: background 0.15s, color 0.15s;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5em;
    }

    #age {
      font-size: 1.4em;
      margin-top: 10px;
      opacity: 0.9;
    }

    #countdown {
      font-size: 2em;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .ms {
      font-size: 0.7em;
      opacity: 0.8;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <h1>Birthday Countdown 🎂</h1>
  <div id="age">Loading...</div>
  <div id="countdown">Loading...</div>

  <canvas id="confetti"></canvas>

  <script>
    // BIRTHDAY SETTINGS
    const birthYear = 2013;
    const birthMonth = 1;
    const birthDay = 15;
    const birthHour = 0;
    const birthMinute = 0;

    let lastTurningAge = null;
    let birthdayCelebrated = false;

    // CONFETTI SETUP
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let confetti = [];

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function launchConfetti() {
      confetti = [];

      for (let i = 0; i < 220; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: -10 - Math.random() * canvas.height,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 7,
          dy: Math.random() * 6 + 5,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
      }

      drawConfetti();
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confetti.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;
      });

      confetti = confetti.filter(p => p.y < canvas.height + 20);

      if (confetti.length > 0) {
        requestAnimationFrame(drawConfetti);
      }
    }

    // CALCULATE THE NEXT BIRTHDAY
    function getNextBirthday() {
      const now = new Date();
      let year = now.getFullYear();

      let birthday = new Date(
        year,
        birthMonth,
        birthDay,
        birthHour,
        birthMinute,
        0,
        0
      );

      if (birthday <= now) {
        birthday = new Date(
          year + 1,
          birthMonth,
          birthDay,
          birthHour,
          birthMinute,
          0,
          0
        );
      }

      return birthday;
    }

    // UPDATE THE COUNTDOWN
    function updateCountdown() {
      const now = new Date();
      const birthday = getNextBirthday();

      const diff = birthday.getTime() - now.getTime();
      const turningAge = birthday.getFullYear() - birthYear;

      document.getElementById("age").textContent =
        `Days until ${turningAge}`;

      // Celebrate when the birthday arrives.
      if (diff <= 0 && !birthdayCelebrated) {
        birthdayCelebrated = true;

        document.getElementById("countdown").textContent =
          "HAPPY BIRTHDAY! 🎉🎂";

        launchConfetti();
        return;
      }

      // Reset the celebration state for the next birthday.
      if (diff > 0) {
        birthdayCelebrated = false;
      }

      // Launch confetti when the countdown moves to a new birthday year.
      if (lastTurningAge !== null && turningAge !== lastTurningAge) {
        launchConfetti();
      }

      lastTurningAge = turningAge;

      // COLOR-CHANGING EFFECT DURING THE FINAL MINUTE
      if (diff <= 60000) {
        const hue = Math.random() * 360;

        document.body.style.background =
          `hsl(${hue}, 100%, 55%)`;

        document.body.style.color =
          `hsl(${(hue + 180) % 360}, 100%, 95%)`;

        document.body.style.textShadow =
          "0 0 14px rgba(255,255,255,0.9)";
      } else {
        document.body.style.background = "#0f172a";
        document.body.style.color = "#e5e7eb";
        document.body.style.textShadow = "none";
      }

      // CALCULATE DAYS, HOURS, MINUTES, SECONDS, AND MILLISECONDS
      let remaining = diff;

      const days = Math.floor(remaining / 86400000);
      remaining %= 86400000;

      const hours = Math.floor(remaining / 3600000);
      remaining %= 3600000;

      const minutes = Math.floor(remaining / 60000);
      remaining %= 60000;

      const seconds = Math.floor(remaining / 1000);
      const ms = remaining % 1000;

      document.getElementById("countdown").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s
        <span class="ms">${ms.toString().padStart(3, "0")}ms</span>`;
    }

    // RUN ONCE IMMEDIATELY, THEN UPDATE 20 TIMES PER SECOND.
    updateCountdown();
    setInterval(updateCountdown, 50);
  </script>

</body>
</html>
